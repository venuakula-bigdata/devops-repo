name: Clone workflow
on:
 workflow_dispatch:
  inputs:
    ENVIRONMENT:
      type: choice
      description: select target environment
      options: [DEV, ST, SIT, UAT, PROD, DR]

jobs:
  cloning:
    runs-on: ubuntu-latest

    steps:
    - name: Clone private repository
      run: |
       git clone https://x-access-token:${{ secrets.ACTIONS_PAT }}@github.com/venuakula-bigdata/develop.git
       
    - name: List contents of GITHUB_WORKSPACE
      run: |
       echo "Listing contents of $GITHUB_WORKSPACE:"
       ls -la $GITHUB_WORKSPACE/develop
