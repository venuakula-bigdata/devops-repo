name: Deploy to Kubernetes

on:
 workflow_dispatch:
  inputs:
    ENVIRONMENT:
      type: choice
      description: select target environment
      options: [DEV, ST, SIT, UAT, PROD, DR]
env:
  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG6 }}
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Install kubectl (latest stable release)
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
           version: 'v1.31.0' # or 'latest'


      # Write kubeconfig from secret into a file
      - name: Set up kubeconfig
        run: |
          echo "${{secrets.KUBE_CONFIG6}}" > ${{ github.workspace }}/kubeconfig.yaml
          # mkdir -p $HOME/.kube
          # sudo cp -i /etc/kubernetes/admin.conf $HOME/.kube/config
          # sudo chown $(id -u):$(id -g) $HOME/.kube/config

      # Apply manifests
      - name: Deploy manifests
        run: |
          kubectl apply -f deployment1.yaml -n dev1 --validate=false --insecure-skip-tls-verify=true
        env:
          KUBE_CONFIG: ${{ github.workspace }}/kubeconfig.yaml
