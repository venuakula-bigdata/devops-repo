apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-deployment
  namespace: dev1
spec:
  replicas: 5
  selector:
    matchLabels:
      app: k8s-deployment
  template:
    metadata:
      labels:
        app: k8s-deployment
    spec:
      containers:
      - name: busybox-container
        image: busybox
        command: ["tail","-f","/dev/null"]
      - name: nginx-container
        image: nginx
        ports:
        - containerPort: 80
